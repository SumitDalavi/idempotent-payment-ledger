apiVersion: apps/v1
kind: Deployment
metadata:
  name: idempotent-payment-ledger
  labels:
    app.kubernetes.io/name: idempotent-payment-ledger
    app.kubernetes.io/part-of: distributed-systems
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idempotent-payment-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idempotent-payment-ledger
        app.kubernetes.io/part-of: distributed-systems
    spec:
      serviceAccountName: idempotent-payment-ledger
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/sumitdalavi/idempotent-payment-ledger:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
